name: Infotheo [Build HTML and upload as Artifact]

on:
  push:
    branches: ["mca2html"]
  pull_request:
  schedule:
    - cron: 0 0 * * * # every morning
  workflow_dispatch:

jobs:
  generate-artifact:
    runs-on: ubuntu-latest
    continue-on-error: true  # ← If a job fails, do not make it a total failure
    strategy:
      matrix:
        infotheo:
          - '0.9.4'
        image:
          - 'yoshihiro503/mathcomp-analysis:1.12.0-coq-8.20-ocaml-4.14-flambda'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: set the variables for push event
        if: ${{ github.event_name == 'push' }}
        run: |
          branch_name=${{ github.ref_name }}
          short_sha=$(git rev-parse --short ${{ github.sha }})
          echo "destination_dir=sample_"$branch_name_$short_sha >> $GITHUB_ENV

      - name: set the variables for PR event
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          branch_name=${{ github.head_ref }}
          echo "destination_dir=sample_$branch_name" >> $GITHUB_ENV

      - name: set the variables for scheduled event
        if: ${{ github.event_name == 'schedule' }}
        run: |
          name=${{ github.action }}
          echo "destination_dir=nightly_$name" >> $GITHUB_ENV

      - name: set the variables for manual (workflow_dispatch) event
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          short_sha=$(git rev-parse --short ${{ github.sha }})
          echo "destination_dir=manual_$short_sha" >> $GITHUB_ENV

      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'rocq-navi.opam'
          custom_image: ${{ matrix.image }}
          before_script: |
            startGroup "Build Rocqnavi"
              sudo apt-get install -y graphviz
              sudo chown -R 1000:1000 .
              dune build bin/rocqnavi.exe
              ln -sf _build/default/bin/rocqnavi.exe rocqnavi
            endGroup
            startGroup "Fetch and build Infotheo"
              git clone --depth 1 --branch ${{ matrix.infotheo }} https://github.com/affeldt-aist/infotheo.git infotheo
              cd infotheo/
              opam install -y coq-interval coq-mathcomp-algebra-tactics coq-mathcomp-reals-stdlib
              make all
              cd ..
            endGroup
          script: |
            startGroup "Do Rocqnavi"
              export SOURCE=infotheo
              export REVISION=${{ matrix.infoetheo }}-rocqnavi-${{ env.destination_dir }}
              export DIR=$(pwd `dirname .`)
              export OUTDIR=$DIR/html/infotheo-$REVISION
              ./tools/generate-infotheo.sh
            endGroup

      - name: Upload htmldoc as artifacts (for humans to inspect this run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.destination_dir }}
          path: |
            html

      # Stable name (unlike the one above, which varies per event/branch/sha)
      # so deploy_static_site.yml can fetch "the latest one" by artifact name
      # instead of needing to know this run's destination_dir.
      - name: Upload htmldoc as artifact (stable name, for deploy_static_site.yml)
        uses: actions/upload-artifact@v4
        with:
          name: infotheo-html
          path: |
            html
