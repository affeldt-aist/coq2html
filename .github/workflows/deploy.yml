name: Deploy artifacts

on:
  # Triggered by the (expensive, independently-scheduled) doc-build workflows
  # finishing on mca2html, instead of polling/searching for their runs here.
  workflow_run:
    workflows:
      - "Analysis [Build HTML and upload as Artifact]"
      - "Infotheo [Build HTML and upload as Artifact]"
    types: [completed]
    branches: ["mca2html"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# and to read artifacts/run history from the gen_* workflows below.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: top site
        run: mkdir html && cp -r .github/workflows/resources/* html/

      ## Mathcomp Analysis (built by gen_analysis_artifact.yml) --------
      - name: Find analysis-doc run to deploy
        id: analysis_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.workflow_run.name }}" = "Analysis [Build HTML and upload as Artifact]" ]; then
            # This run itself is what triggered us - use it directly, no lookup needed.
            run_id=${{ github.event.workflow_run.id }}
          else
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gen_analysis_artifact.yml \
              --status success --branch mca2html --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful run of gen_analysis_artifact.yml on mca2html yet - nothing to deploy"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download analysis doc
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.analysis_run.outputs.run_id }}
          name: analysis-html
          path: html

      - name: Place analysis doc under html/analysis
        run: |
          src=$(ls -d html/analysis-*/ | head -n1)
          mv "$src" html/analysis
          sed -i '/<!-- ADD_ITEM -->/ i <li><a href="analysis">Math-Comp Analysis</a></li>' html/index.html
      ## ----------------------------

      ## Infotheo (built by gen_infotheo_artifact.yml) -----------------
      - name: Find infotheo-doc run to deploy
        id: infotheo_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.workflow_run.name }}" = "Infotheo [Build HTML and upload as Artifact]" ]; then
            # This run itself is what triggered us - use it directly, no lookup needed.
            run_id=${{ github.event.workflow_run.id }}
          else
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gen_infotheo_artifact.yml \
              --status success --branch mca2html --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful run of gen_infotheo_artifact.yml on mca2html yet - nothing to deploy"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download infotheo doc
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.infotheo_run.outputs.run_id }}
          name: infotheo-html
          path: html

      - name: Place infotheo doc under html/infotheo
        run: |
          src=$(ls -d html/infotheo-*/ | head -n1)
          mv "$src" html/infotheo
          sed -i '/<!-- ADD_ITEM -->/ i <li><a href="infotheo">Infotheo</a></li>' html/index.html
      ## ----------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'html/'

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs: generate-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
